name: secrets

# A scan of the whole tree for secrets with gitleaks (MIT). Run by hand for now (Actions, secrets, Run workflow),
# until it runs on every push as well. It prints where it found something, never the secret itself (--redact). A
# finding that is a test's made-up value gets a "// gitleaks:allow" comment on its line, after someone checked it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the files
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 dir /repo --redact --verbose
      - name: Scan the history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --verbose
