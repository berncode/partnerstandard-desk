name: release

# A tag like v1.4.2 publishes the self-hosted image: first it is checked on
# both architectures and on the previous release's database, then pushed. Which tags move (1.4.2, 1.4, 1, latest)
# comes from scripts/release/plan.sh: a fix for an older line never moves `latest`. Publish the GitHub release (its
# notes) only once this workflow is green: servers' update notice reads the release list.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.plan.outputs.image }}
      version: ${{ steps.plan.outputs.version }}
      stable: ${{ steps.plan.outputs.stable }}
      latest: ${{ steps.plan.outputs.latest }}
      major: ${{ steps.plan.outputs.major }}
      minor: ${{ steps.plan.outputs.minor }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: |
          # Image names are lower case; an owner's name may not be.
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/partnerstandard-desk" >> "$GITHUB_OUTPUT"
          git tag --list 'v*' | scripts/release/plan.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
      - run: bash scripts/release/plan.test.sh

  check:
    name: check (${{ matrix.platform }})
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The previous release's image, while the package is still private.
      packages: read
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same inputs as the publish job, so the image published is the image checked (from the same cache).
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: partnerstandard-desk:check
          build-args: |
            APP_VERSION=${{ needs.plan.outputs.version }}
            APP_REPO=${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      # Live check 1 on this architecture: uid 1000, /data, the migrations, WAL, a write, a read, a restart. arm64 runs
      # emulated here: slow, but the same image.
      - name: Image check
        run: scripts/release/image-check.sh partnerstandard-desk:check ${{ matrix.platform }}
      # The previous release's database, made and filled by that release's own image, then started with this one. A
      # release whose image never got published is skipped for the one before it.
      - name: Upgrade from the previous release
        if: matrix.platform == 'linux/amd64'
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          for tag in $PREVIOUS; do
            if docker manifest inspect "$IMAGE:${tag#v}" >/dev/null 2>&1; then
              docker pull "$IMAGE:${tag#v}"
              scripts/release/upgrade-check.sh "$IMAGE:${tag#v}" partnerstandard-desk:check
              exit 0
            fi
            echo "No image for $tag: trying the release before it."
          done
          echo "No earlier release with an image: nothing to update from."

  publish:
    needs: [plan, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.plan.outputs.image }}
          # Its own version always; 1.4, 1 and latest only when no higher release is in that line (plan.sh).
          tags: |
            type=raw,value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.plan.outputs.minor }}
            type=semver,pattern={{major}},enable=${{ needs.plan.outputs.major }}
            type=raw,value=latest,enable=${{ needs.plan.outputs.latest }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=PartnerStandard Desk
            org.opencontainers.image.licenses=AGPL-3.0-only AND CC-BY-4.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ needs.plan.outputs.version }}
            APP_REPO=${{ github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
